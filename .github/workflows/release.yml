# Publishes a heliosctl release when a version tag (v<Cargo version>, for example v0.1.0) is
# pushed: prebuilt binaries for Linux (x86_64, arm64; glibc 2.31 or newer) and macOS (Apple
# silicon), each a .tar.gz with the README, the license and the manual pages (man/), and
# SHA256SUMS, on the GitHub release.
#
# Install (the repository is private, so through gh):
#   gh release download v0.1.0 -R kench/helios-cli -p 'heliosctl-*-x86_64-unknown-linux-gnu.tar.gz' -p SHA256SUMS
#   sha256sum --ignore-missing -c SHA256SUMS
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The oldest glibc the Linux binaries run on (Debian 11, Ubuntu 22.04).
  GLIBC: "2.31"
  ZIG_VERSION: 0.14.1
  CARGO_ZIGBUILD_VERSION: 0.24.1

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag matches Cargo.toml and is on main
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            zig: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            zig: true
          - target: aarch64-apple-darwin
            runner: macos-15
            zig: false
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs the toolchain pinned in rust-toolchain.toml, with the target.
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        run: |
          python3 -m pip install --user "ziglang==$ZIG_VERSION"
          cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"

      - name: Build (Linux, for glibc ${{ env.GLIBC }})
        if: matrix.zig
        run: cargo zigbuild --locked --release --target "$TARGET.$GLIBC"

      - name: Build (macOS)
        if: ${{ !matrix.zig }}
        run: cargo build --locked --release --target "$TARGET"

      - name: Check the binary runs
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: |
          out=$("target/$TARGET/release/heliosctl" --version)
          test "$out" = "heliosctl $VERSION" || { echo "::error::got: $out"; exit 1; }

      - name: Check glibc
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        run: |
          newest=$(objdump -T "target/$TARGET/release/heliosctl" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          test "$(printf '%s\nGLIBC_%s\n' "$newest" "$GLIBC" | sort -V | tail -1)" = "GLIBC_$GLIBC"

      - name: Package
        run: |
          name="heliosctl-$VERSION-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/heliosctl" README.md LICENSE "$name/"
          cp -R man "$name/man"
          cp -R skills "$name/skills"
          tar -czf "$name.tar.gz" "$name"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: heliosctl-${{ matrix.target }}
          path: heliosctl-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: source

      - name: Download
        uses: actions/download-artifact@v7
        with:
          pattern: heliosctl-*
          merge-multiple: true

      # The agent skill as Claude and ChatGPT take it: a zip holding the heliosctl/ folder.
      - name: Package the agent skill
        run: (cd source/skills && zip -qr "$GITHUB_WORKSPACE/heliosctl-skill.zip" heliosctl)

      - name: Checksums
        run: sha256sum heliosctl-*.tar.gz heliosctl-skill.zip | tee SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "heliosctl ${{ needs.check.outputs.version }}" --generate-notes \
            heliosctl-*.tar.gz heliosctl-skill.zip SHA256SUMS
