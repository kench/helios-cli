[package]
name = "helios-cli"
version = "0.5.0"
edition = "2024"
rust-version = "1.100"
description = "heliosctl: the Helios Control API's command-line client, for operators and AI agents"
license = "CC0-1.0"
publish = false

[[bin]]
name = "heliosctl"
path = "src/main.rs"

[dependencies]
aws-config = { version = "1.13.3", default-features = false, features = ["rustls", "rt-tokio", "credentials-process", "sso"] }
aws-credential-types = "1.3.1"
aws-sigv4 = { version = "1.6.6", default-features = false, features = ["sign-http", "http1"] }
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
dirs = "7.0.0"
http = "1.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "time"] }
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
clap_mangen = "0.3.4"
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "io-util", "time"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "deny"
wildcard_imports = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
